<!doctype html>

<title>Монстр-огород</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<body>
<script src="kit.js"></script>
<script>
'use strict';
/* =========================================================
   МОНСТР-ОГОРОД
   garden — пощекочи сердитые овощи, feed — накорми монстрика
   ========================================================= */
const COL = {
  red:   {hex:'#ef4b3f', ru:'красное',    kk:'қызыл'},
  orange:{hex:'#ff962e', ru:'оранжевое',  kk:'қызғылт сары'},
  yellow:{hex:'#ffd93b', ru:'жёлтое',     kk:'сары'},
  green: {hex:'#58b947', ru:'зелёное',    kk:'жасыл'},
  purple:{hex:'#8a4fc7', ru:'фиолетовое', kk:'күлгін'}
};
const VEG = {
  tomato:  {col:'red',    name:{ru:'помидор',  kk:'қызанақ'},  acc:'помидор',  say:{ru:'Хи-хи! Я помидор. Я красный!',      kk:'Хи-хи! Мен — қызанақ. Түсім қызыл!'}},
  apple:   {col:'red',    name:{ru:'яблоко',   kk:'алма'},     acc:'яблоко',   say:{ru:'Хи-хи! Я яблоко. Я красное!',       kk:'Хи-хи! Мен — алма. Түсім қызыл!'}},
  carrot:  {col:'orange', name:{ru:'морковка', kk:'сәбіз'},    acc:'морковку', say:{ru:'Хи-хи! Я морковка. Я оранжевая!',   kk:'Хи-хи! Мен — сәбіз. Түсім қызғылт сары!'}},
  orange:  {col:'orange', name:{ru:'апельсин', kk:'апельсин'}, acc:'апельсин', say:{ru:'Хи-хи! Я апельсин. Я оранжевый!',   kk:'Хи-хи! Мен — апельсин. Түсім қызғылт сары!'}},
  banana:  {col:'yellow', name:{ru:'банан',    kk:'банан'},    acc:'банан',    say:{ru:'Хи-хи! Я банан. Я жёлтый!',         kk:'Хи-хи! Мен — банан. Түсім сары!'}},
  lemon:   {col:'yellow', name:{ru:'лимон',    kk:'лимон'},    acc:'лимон',    say:{ru:'Хи-хи! Я лимон. Я жёлтый и кислый!', kk:'Хи-хи! Мен — лимон. Түсім сары, дәмім қышқыл!'}},
  cucumber:{col:'green',  name:{ru:'огурец',   kk:'қияр'},     acc:'огурец',   say:{ru:'Хи-хи! Я огурец. Я зелёный!',       kk:'Хи-хи! Мен — қияр. Түсім жасыл!'}},
  broccoli:{col:'green',  name:{ru:'брокколи', kk:'брокколи'}, acc:'брокколи', say:{ru:'Хи-хи! Я брокколи. Я зелёная!',     kk:'Хи-хи! Мен — брокколи. Түсім жасыл!'}},
  eggplant:{col:'purple', name:{ru:'баклажан', kk:'баялды'},   acc:'баклажан', say:{ru:'Хи-хи! Я баклажан. Я фиолетовый!',  kk:'Хи-хи! Мен — баялды. Түсім күлгін!'}},
  grapes:  {col:'purple', name:{ru:'виноград', kk:'жүзім'},    acc:'виноград', say:{ru:'Хи-хи! Я виноград. Я фиолетовый!',  kk:'Хи-хи! Мен — жүзім. Түсім күлгін!'}}
};
const IDS = Object.keys(VEG);
const TX = {
  garden:{ru:'Ой, какие сердитые! Пощекочи их, и они подобреют!', kk:'Ой, қандай ашулы! Оларды қытықта, сонда мейірімді болады!'},
  gardenDone:{ru:'Все подобрели! Какой весёлый огород!', kk:'Бәрі мейірімді болды! Қандай көңілді бақша!'},
  feed:{ru:'Монстрик проголодался! Дай ему то, что он просит.', kk:'Құбыжық қарны ашты! Сұрағанын бер.'},
  wantCol:{ru:c => `Хочу что-нибудь ${c}!`, kk:c => `Маған ${c} түсті тамақ бер!`},
  wantId:{ru:v => `Дай мне ${v.acc}!`, kk:v => `Маған ${v.name.kk} берші!`},
  wrongCol:{ru:(n, c) => `Тьфу! Это ${n}, а я хочу ${c}!`, kk:(n, c) => `Түф! Бұл — ${n}. Маған ${c} түсті керек!`},
  wrongId:{ru:n => `Тьфу! Это ${n}.`, kk:n => `Түф! Бұл — ${n}.`},
  yum:{ru:'Ам-ам!', kk:'Ам-ам!'},
  num:{ru:['Один!','Два!','Три!','Четыре!','Пять!'], kk:['Бір!','Екі!','Үш!','Төрт!','Бес!']},
  full:{ru:'Я наелся! Спасибо!', kk:'Мен тойдым! Рақмет!'}
};

/* ---------- овощи и фрукты ---------- */
function drawVeg(c, id, x, y, s, o = {}){
  c.save(); c.translate(x, y);
  if (o.rot) c.rotate(o.rot);
  if (o.sx) c.scale(o.sx, o.sy);
  let fy = 0, fs = s*.55;
  const G = '#4aa53f';
  switch (id) {
    case 'tomato':
      ell(c, 0, s*.05, s*1.05, s*.95, '#ef4b3f');
      c.fillStyle = G; starPath(c, 0, -s*.82, s*.42, 0); c.fill(); fy = s*.12; break;
    case 'apple':
      circ(c, -s*.36, -s*.05, s*.72, '#e63946'); circ(c, s*.36, -s*.05, s*.72, '#e63946'); ell(c, 0, s*.2, s*.85, s*.8, '#e63946');
      c.strokeStyle = '#7a4a2a'; c.lineWidth = s*.1; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, -s*.55); c.lineTo(s*.1, -s*1.0); c.stroke();
      ell(c, s*.42, -s*.95, s*.32, s*.15, G, -.5); fy = s*.12; break;
    case 'carrot':
      for (const [dx, r] of [[-.35, -.5], [0, 0], [.35, .5]]) ell(c, dx*s, -s*1.15, s*.17, s*.45, G, r);
      c.fillStyle = '#ff8c2e'; c.beginPath(); c.moveTo(-s*.7, -s*.7); c.quadraticCurveTo(0, -s*1.1, s*.7, -s*.7);
      c.quadraticCurveTo(s*.5, s*.65, 0, s*1.3); c.quadraticCurveTo(-s*.5, s*.65, -s*.7, -s*.7); c.fill();
      c.strokeStyle = 'rgba(180,80,10,.4)'; c.lineWidth = s*.06; c.lineCap = 'round';
      for (const [yy, w] of [[.55, .2], [.8, .13]]) { c.beginPath(); c.moveTo(-s*w, s*yy); c.lineTo(s*w, s*yy); c.stroke(); }
      fy = -s*.22; fs = s*.5; break;
    case 'orange':
      circ(c, 0, 0, s, '#ff9f2e');
      for (const [dx, dy] of [[.55, .4], [-.6, .3], [.3, .7], [-.3, -.7]]) circ(c, dx*s, dy*s, s*.04, 'rgba(180,90,0,.35)');
      ell(c, s*.2, -s*.98, s*.3, s*.13, G, -.4); fy = s*.05; break;
    case 'banana':
      c.strokeStyle = '#ffd93b'; c.lineWidth = s*.85; c.lineCap = 'round';
      c.beginPath(); c.arc(0, -s*1.15, s*1.4, Math.PI*.24, Math.PI*.76); c.stroke();
      for (const a of [.24, .76]) circ(c, Math.cos(Math.PI*a)*s*1.4 + (a < .5 ? s*.2 : -s*.2), -s*1.15 + Math.sin(Math.PI*a)*s*1.4 - s*.22, s*.13, '#7a5a2a');
      fy = s*.22; fs = s*.42; break;
    case 'lemon':
      circ(c, -s*1.1, 0, s*.18, '#ffe14a'); circ(c, s*1.1, 0, s*.18, '#ffe14a');
      ell(c, 0, 0, s*1.12, s*.85, '#ffe14a'); fy = s*.02; break;
    case 'cucumber':
      rr(c, -s*.55, -s*1.2, s*1.1, s*2.4, s*.55); c.fillStyle = '#5dbb4d'; c.fill();
      for (const [dx, dy] of [[-.3, -.85], [.3, -.7], [-.32, .75], [.25, .9], [0, 1.0]]) circ(c, dx*s, dy*s, s*.05, 'rgba(20,90,20,.4)');
      fy = -s*.15; fs = s*.45; break;
    case 'broccoli':
      rr(c, -s*.36, -s*.1, s*.72, s*1.25, s*.2); c.fillStyle = '#a6db86'; c.fill();
      for (const [dx, dy, r] of [[-.62, -.3, .5], [.62, -.3, .5], [0, -.7, .58], [-.32, -.1, .48], [.32, -.1, .48]]) circ(c, dx*s, dy*s, r*s, '#3f9a4a');
      fy = -s*.32; fs = s*.5; break;
    case 'eggplant':
      ell(c, 0, s*.3, s*.82, s*.95, '#7a3fb0'); ell(c, 0, -s*.4, s*.55, s*.6, '#7a3fb0');
      c.fillStyle = G; starPath(c, 0, -s*.92, s*.42, 0); c.fill();
      rr(c, -s*.07, -s*1.35, s*.14, s*.4, s*.06); c.fill(); fy = s*.2; break;
    case 'grapes':
      ell(c, s*.3, -s*1.0, s*.34, s*.16, G, -.4);
      for (const [dx, dy] of [[-.62, -.45], [0, -.5], [.62, -.45], [-.34, .12], [.34, .12], [0, .7]]) circ(c, dx*s, dy*s, s*.42, '#8a4fc7');
      for (const [dx, dy] of [[-.62, -.45], [.62, -.45], [0, .7]]) circ(c, dx*s - s*.12, dy*s - s*.14, s*.1, 'rgba(255,255,255,.25)');
      fy = -s*.15; fs = s*.5; break;
  }
  ell(c, -s*.35, fy - s*.45, s*.22, s*.12, 'rgba(255,255,255,.28)', -.6);
  if (o.face !== false) drawFace(c, 0, fy, fs, {mood:o.mood, seed:o.seed, lookX:ptr.x - x, lookY:ptr.y - y});
  c.restore();
}

/* ---------- фон ---------- */
function drawSky(c, groundY){
  const g = c.createLinearGradient(0, 0, 0, groundY); g.addColorStop(0, '#7fd0f5'); g.addColorStop(1, '#c8f0ff');
  c.fillStyle = g; c.fillRect(0, 0, W, groundY);
  const s = Math.min(area.w, area.h)*.1;
  circ(c, area.x1 - s*1.6, area.y0 + s*1.2, s*.9, '#ffd93b');
  c.fillStyle = 'rgba(255,255,255,.85)';
  for (const [fx, fy, k] of [[.2, .1, 1], [.62, .2, .75]]) {
    const x = area.x0 + area.w*fx + Math.sin(now*.1 + fx*9)*s, y = area.y0 + area.h*fy;
    circ(c, x, y, s*.5*k, 'rgba(255,255,255,.85)'); circ(c, x + s*.55*k, y + s*.1*k, s*.4*k, 'rgba(255,255,255,.85)'); circ(c, x - s*.5*k, y + s*.12*k, s*.36*k, 'rgba(255,255,255,.85)');
  }
}

/* =========================================================
   ОГОРОД
   ========================================================= */
let gd = {items:[], doneAt:0, nextAt:0};
function gardenPos(i){
  const a = area, cols = land ? 4 : 2, rows = land ? 1 : 2;
  const cw = a.w/cols, top = a.y0 + a.h*.2, ch = (a.y1 - top)/rows;
  const col = i % cols, row = Math.floor(i/cols);
  return {x:a.x0 + cw*(col + .5), y:top + ch*(row + .52), s:Math.min(cw, ch)*.27};
}
function newGarden(quiet){
  const prev = gd.items.map(v => v.id);
  let ids = shuffle(IDS.filter(id => !prev.includes(id))).slice(0, 4);
  gd = {items:ids.map((id, i) => ({id, stage:0, wob:0, seed:i*2.3})), doneAt:0, nextAt:0};
  if (!quiet) { sfx.growl(); speak(L(TX.garden)); }
}
function updateGarden(dt){
  for (const v of gd.items) v.wob = Math.max(0, v.wob - dt);
  if (gd.doneAt && now > gd.doneAt) { gd.doneAt = 0; celebrate(); speak(L(TX.gardenDone)); gd.nextAt = now + 4.5; }
  if (gd.nextAt && now > gd.nextAt) newGarden();
}
function gardenTap(x, y){
  gd.items.forEach((v, i) => {
    const p = gardenPos(i);
    if (Math.hypot(x - p.x, y - p.y) > p.s*1.7) return;
    v.wob = .5; sfx.giggle();
    puff(x, y, '#fff', 4, {r:4});
    if (v.stage < 3) {
      v.stage++;
      if (v.stage === 3) {
        sfx.success(); addStar(p.x, p.y);
        if (!gd.doneAt && !gd.nextAt) speak(L(VEG[v.id].say));
        if (gd.items.every(t => t.stage === 3)) gd.doneAt = now + 2.8;
      }
    } else if (!gd.doneAt && !gd.nextAt) speak(L(VEG[v.id].say));
  });
}
function renderGarden(){
  const c = ctx, a = area;
  const gy = a.y0 + a.h*.2;
  drawSky(c, gy + 10);
  // забор и грядки
  const s0 = gardenPos(0).s;
  c.fillStyle = '#e9c48f';
  for (let x = a.x0 % (s0*.7); x < W; x += s0*.7) { rr(c, x, gy - s0*.9, s0*.5, s0*1.2, s0*.2); c.fill(); }
  c.fillRect(0, gy - s0*.45, W, s0*.16);
  c.fillStyle = '#7ac74f'; c.fillRect(0, gy, W, H - gy);
  gd.items.forEach((v, i) => {
    const p = gardenPos(i), s = p.s;
    ell(c, p.x, p.y + s*1.25, s*1.9, s*.55, '#8a5a3c'); ell(c, p.x, p.y + s*1.18, s*1.6, s*.4, '#a06a46');
    const mood = v.stage === 3 ? 'happy' : v.stage === 2 ? 'scared' : 'angry';
    let rot = 0, yy = p.y, sx = 1, sy = 1;
    if (v.stage === 0) rot = Math.sin(now*22 + i)*.05;
    if (v.stage === 3) yy -= Math.abs(Math.sin(now*5 + i))*s*.25;
    if (v.wob > 0) { const w = Math.sin(v.wob*40)*v.wob*.35; sx = 1 + w; sy = 1 - w; rot += Math.sin(v.wob*30)*.15; }
    drawVeg(c, v.id, p.x, yy, s, {mood, rot, sx, sy, seed:v.seed});
    if (v.stage < 2 && Math.random() < .04) puff(p.x + rand(-s, s)*.6, yy - s*1.1, 'rgba(255,90,70,.7)', 1, {vy:-40, r:rand(3, 6)});
  });
}

/* =========================================================
   НАКОРМИ МОНСТРИКА
   ========================================================= */
let fd = {req:null, foods:[], count:0, fly:null, mood:'normal', chomp:0, nextAt:0, resetAt:0};
function feedGeom(){
  const a = area;
  if (land) {
    const cell = Math.min(a.w*.22, a.h*.48);
    return {mx:a.x0 + a.w*.27, my:a.y0 + a.h*.48, ms:Math.min(a.w*.16, a.h*.3), fs:cell*.3,
      pos:i => ({x:a.x0 + a.w*.78 + (i % 2 - .5)*cell, y:a.cy + (Math.floor(i/2) - .5)*cell})};
  }
  const cw = a.w/4, fs = Math.min(cw*.33, a.h*.07);
  return {mx:a.cx, my:a.y0 + a.h*.38, ms:Math.min(a.w*.22, a.h*.2), fs, pos:i => ({x:a.x0 + cw*(i + .5), y:a.y1 - fs*1.7})};
}
function newRound(prefix = ''){
  fd.nextAt = 0; fd.fly = null; fd.mood = 'normal';
  const byColor = Math.random() < .6;
  let ids;
  if (byColor) {
    const col = pick(Object.keys(COL));
    const good = shuffle(IDS.filter(id => VEG[id].col === col)).slice(0, Math.random() < .5 ? 1 : 2);
    const bad = shuffle(IDS.filter(id => VEG[id].col !== col)).slice(0, 4 - good.length);
    ids = shuffle(good.concat(bad));
    fd.req = {type:'col', col};
  } else {
    const id = pick(IDS);
    ids = shuffle([id].concat(shuffle(IDS.filter(v => v !== id)).slice(0, 3)));
    fd.req = {type:'id', id};
  }
  fd.foods = ids.map(id => ({id, gone:false, born:now}));
  speak(prefix + reqText());
}
function reqText(){
  const r = fd.req;
  return r.type === 'col' ? TX.wantCol[lang](L(COL[r.col])) : TX.wantId[lang](VEG[r.id]);
}
function startFeed(quiet){
  fd = {req:null, foods:[], count:0, fly:null, mood:'normal', chomp:0, nextAt:0, resetAt:0};
  subLift = land ? 0 : feedGeom().fs*3.3; placeSub();
  newRound(quiet ? '' : L(TX.feed) + ' ');
}
function updateFeed(dt){
  const g = feedGeom();
  fd.chomp = Math.max(0, fd.chomp - dt);
  const f = fd.fly;
  if (f) {
    f.t += dt / .45;
    if (f.t >= 1 && !f.back) {
      if (f.ok) {
        fd.fly = null; fd.foods[f.i].gone = true; fd.chomp = .7; fd.mood = 'happy';
        sfx.chomp(); fd.count++;
        burst(g.mx, g.my + g.ms*.3, 12, .8);
        const n = fd.count;
        if (n >= 5) {
          addStar(); celebrate();
          speak(L(TX.yum) + ' ' + TX.num[lang][4] + ' ' + L(TX.full));
          fd.resetAt = now + 3.5; fd.nextAt = now + 4.2;
        } else { speak(L(TX.yum) + ' ' + TX.num[lang][n - 1]); fd.nextAt = now + 1.9; }
      } else { f.back = true; f.t = 0; fd.mood = 'yuck'; sfx.soft(); speak(f.msg); }
    } else if (f.t >= 1 && f.back) { fd.fly = null; fd.mood = 'normal'; }
  }
  if (fd.resetAt && now > fd.resetAt) { fd.resetAt = 0; fd.count = 0; }
  if (fd.nextAt && now > fd.nextAt) newRound();
}
function feedTap(x, y){
  const g = feedGeom();
  if (fd.fly || fd.nextAt) return;
  for (let i = 0; i < fd.foods.length; i++) {
    const fo = fd.foods[i]; if (fo.gone) continue;
    const p = g.pos(i);
    if (Math.hypot(x - p.x, y - p.y) < Math.max(g.fs*1.7, 34)) {
      sfx.pick();
      const v = VEG[fo.id], r = fd.req;
      const ok = r.type === 'col' ? v.col === r.col : fo.id === r.id;
      const msg = r.type === 'col' ? TX.wrongCol[lang](L(v.name), L(COL[r.col])) : TX.wrongId[lang](L(v.name)) + ' ' + reqText();
      fd.fly = {i, t:0, ok, back:false, msg};
      return;
    }
  }
  if (Math.hypot(x - g.mx, y - g.my) < g.ms*1.6) { sfx.tap(); speak(reqText()); }
}
function drawMonster(c, x, y, s, open, mood){
  const col = '#4fc3c9';
  for (const sd of [-1, 1]) { ell(c, x + sd*s*.45, y + s*1.0, s*.3, s*.16, '#3a9aa0'); circ(c, x + sd*s*1.05, y + s*.15, s*.22, col); }
  c.fillStyle = '#ffe9b0';
  for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(x + sd*s*.35, y - s*.85); c.lineTo(x + sd*s*.62, y - s*1.35); c.lineTo(x + sd*s*.72, y - s*.72); c.closePath(); c.fill(); }
  ell(c, x, y, s*1.0, s*1.02, col);
  for (const [dx, dy, r] of [[-.6, .55, .12], [.65, .4, .1], [-.7, -.1, .08], [.5, .75, .07]]) circ(c, x + dx*s, y + dy*s, r*s, 'rgba(255,255,255,.25)');
  c.fillStyle = shade(c, x, y, s); c.beginPath(); c.arc(x, y, s, 0, 7); c.fill();
  drawFace(c, x, y - s*.38, s*.6, {mood:mood === 'yuck' ? 'normal' : mood, noMouth:true, seed:5});
  // большой рот
  const mh = s*(.1 + .38*open), my = y + s*.32;
  ell(c, x, my, s*.62, mh, '#5a1d2d');
  if (open > .3) ell(c, x, my + mh*.5, s*.32, mh*.35, '#ff8fa3');
  c.fillStyle = '#fff';
  for (const tx of [-.3, 0, .3]) { c.beginPath(); c.moveTo(x + (tx - .1)*s, my - mh*.9); c.lineTo(x + tx*s, my - mh*.9 + s*.16); c.lineTo(x + (tx + .1)*s, my - mh*.9); c.fill(); }
  if (mood === 'yuck') ell(c, x + s*.1, my + mh + s*.05, s*.16, s*.22, '#ff8fa3');
}
function renderFeed(){
  const c = ctx, a = area, g = feedGeom();
  const gy = land ? a.y1 - a.h*.12 : g.my + g.ms*1.25;
  drawSky(c, gy + 10);
  c.fillStyle = '#7ac74f'; c.fillRect(0, gy, W, H - gy);
  ell(c, a.cx, gy, a.w*.8, g.ms*.35, '#8ad65c');
  // монстрик
  let open = .25 + .08*Math.sin(now*3);
  if (fd.fly && !fd.fly.back) open = .4 + .6*Math.min(1, fd.fly.t*1.5);
  if (fd.chomp > 0) open = Math.abs(Math.sin(fd.chomp*18))*.8;
  shadow(c, g.mx, g.my + g.ms*1.12, g.ms*.9);
  drawMonster(c, g.mx, g.my - (fd.mood === 'happy' ? Math.abs(Math.sin(now*9))*g.ms*.08 : 0), g.ms, open, fd.mood);
  // животик-счётчик
  for (let i = 0; i < 5; i++) {
    const x = g.mx + (i - 2)*g.ms*.36, y = g.my + g.ms*1.45;
    circ(c, x, y, g.ms*.13, 'rgba(255,255,255,.55)');
    if (i < fd.count) { c.fillStyle = '#ffb21c'; starPath(c, x, y, g.ms*.13, 0); c.fill(); }
  }
  // облачко с просьбой
  if (fd.req && started) {
    const bx = g.mx + g.ms*1.45, by = g.my - g.ms*.95, br = g.ms*.52;
    circ(c, bx - br*.9, by + br*.85, br*.2, '#fff'); circ(c, bx - br*1.25, by + br*1.15, br*.12, '#fff');
    circ(c, bx, by, br*(1 + .03*Math.sin(now*4)), '#fff');
    if (fd.req.type === 'col') {
      c.fillStyle = COL[fd.req.col].hex;
      c.beginPath(); for (let i = 0; i < 9; i++) { const an = i/9*Math.PI*2, r = br*(.55 + (i % 2)*.14); c.lineTo(bx + Math.cos(an)*r, by + Math.sin(an)*r); } c.closePath(); c.fill();
      circ(c, bx, by, br*.5, COL[fd.req.col].hex);
    } else drawVeg(c, fd.req.id, bx, by + br*.05, br*.42, {face:false});
  }
  // тарелка с едой
  fd.foods.forEach((fo, i) => {
    if (fo.gone) return;
    const p = g.pos(i), s = g.fs;
    ell(c, p.x, p.y + s*1.15, s*1.5, s*.4, 'rgba(255,255,255,.75)');
    let x = p.x, y = p.y + Math.sin(now*2.5 + i)*s*.08, k = easeBack(clamp((now - fo.born)/.4, 0, 1)), rot = 0;
    const f = fd.fly;
    if (f && f.i === i) {
      const t = ease(Math.min(1, f.t)), tx = g.mx, ty = g.my + g.ms*.32;
      const u = f.back ? 1 - t : t;
      x = lerp(p.x, tx, u); y = lerp(p.y, ty, u) - Math.sin(u*Math.PI)*g.ms*.9;
      k = 1 - u*.45; rot = u*6*(f.back ? -1 : 1);
    }
    drawVeg(c, fo.id, x, y, s*k, {rot});
  });
}

kitStart({
  key:'veggies', icon:'🥕', title:{ru:'Монстр-огород', kk:'Құбыжық бақша'},
  modes:[
    {id:'garden', icon:'🥕', name:{ru:'Огород', kk:'Бақша'}},
    {id:'feed',   icon:'👾', name:{ru:'Накорми', kk:'Тамақтандыр'}}
  ],
  setMode(m, quiet){ if (m === 'garden') { subTop = true; gd.items = []; newGarden(quiet); } else startFeed(quiet); },
  lang(){ if (mode === 'garden') speak(L(TX.garden)); else speak(reqText()); },
  update(dt){ if (mode === 'garden') updateGarden(dt); else updateFeed(dt); },
  render(){ if (mode === 'garden') renderGarden(); else renderFeed(); },
  down(x, y){ if (mode === 'garden') gardenTap(x, y); else feedTap(x, y); }
});
