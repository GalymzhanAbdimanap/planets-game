<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Познавательная игра о Солнечной системе для детей 3–5 лет. Русский и казахский язык.">
<title>Привет, планеты!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1030;
    --ink:#2a1d4d;
    --sun1:#ffd23f;
    --sun2:#ff9d1c;
    --glass:rgba(255,255,255,.13);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;
    font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation}

  #top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;z-index:5}
  #top>*{pointer-events:auto}
  .side{display:flex;gap:8px;align-items:center;min-width:112px}
  .side.r{justify-content:flex-end}
  .round{width:52px;height:52px;border-radius:50%;border:none;background:var(--glass);color:#fff;
    font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .round.txt{font-size:15px}
  a.round{text-decoration:none}
  @media (max-width:420px){ body.finding #home{display:none} }
  .round.off{opacity:.45}
  #stars{height:52px;padding:0 16px;border-radius:26px;background:var(--glass);display:none;align-items:center;gap:6px;
    font-size:22px;font-weight:900}
  #prompt{display:none;align-items:center;gap:10px;height:64px;padding:0 10px 0 16px;border-radius:32px;border:none;
    background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.35);animation:pop .4s}
  #prompt .hint{font-size:36px;line-height:1}
  #prompt .rep{width:46px;height:46px;border-radius:50%;background:linear-gradient(var(--sun1),var(--sun2));
    display:flex;align-items:center;justify-content:center;font-size:22px}

  #modes{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;z-index:5;
    padding:8px 10px calc(env(safe-area-inset-bottom) + 10px)}
  .mode{flex:1;max-width:96px;height:74px;border-radius:24px;border:none;background:var(--glass);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:32px;line-height:1;
    transition:transform .2s,background .2s}
  .mode span{font-size:12px;font-weight:900;opacity:.9}
  .mode.on{background:linear-gradient(var(--sun1),var(--sun2));color:#3a1c00;transform:translateY(-5px);
    box-shadow:0 6px 18px rgba(255,160,40,.45)}

  #sub{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);width:max-content;max-width:min(92vw,560px);z-index:4;
    background:rgba(255,255,255,.93);color:var(--ink);padding:10px 18px;border-radius:20px;font-size:17px;font-weight:800;
    text-align:center;line-height:1.3;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  #sub.show{opacity:1;transform:translate(-50%,0)}

  #close{position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 74px);z-index:6;display:none;
    width:60px;height:60px;font-size:28px;background:rgba(255,255,255,.2)}
  #again{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;display:none;
    padding:18px 30px;border-radius:40px;border:none;font-size:26px;font-weight:900;color:#3a1c00;
    background:linear-gradient(var(--sun1),var(--sun2));box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .5s}

  #start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(ellipse at center,rgba(11,16,48,.55),rgba(11,16,48,.92))}
  #start .box{text-align:center;max-width:420px;width:100%}
  #start h1{margin:0 0 6px;font-size:clamp(34px,10vw,52px);font-weight:900;line-height:1.05;
    background:linear-gradient(#fff3a8,#ffb23f);-webkit-background-clip:text;background-clip:text;color:transparent}
  #start h2{margin:0 0 28px;font-size:clamp(20px,6vw,28px);font-weight:800;color:#bcd0ff}
  .big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin:12px 0;padding:20px;border:none;
    border-radius:32px;font-size:26px;font-weight:900;color:#3a1c00;background:linear-gradient(var(--sun1),var(--sun2));
    box-shadow:0 8px 0 #c86a0a,0 14px 30px rgba(0,0,0,.4);animation:breathe 2.4s ease-in-out infinite}
  .big.kk{background:linear-gradient(#7fe3ff,#2fa6e0);color:#06294a;box-shadow:0 8px 0 #1a6f9e,0 14px 30px rgba(0,0,0,.4);animation-delay:1.2s}
  .big:active{transform:translateY(4px)}
  .note{margin-top:22px;font-size:14px;color:#9fb0d8;font-weight:700;line-height:1.5}

  #safe{position:fixed;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* Горизонтальный телефон: меню колонкой слева, система на всю высоту */
  body.land #modes{top:0;bottom:0;right:auto;flex-direction:column;justify-content:center;gap:8px;
    padding:8px 8px calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
  body.land .mode{flex:0 0 auto;width:84px;height:min(72px,calc((100vh - 56px) / 4));max-width:none;font-size:28px}
  body.land .mode.on{transform:translateX(5px)}
  body.land #top{left:var(--mw,0px);justify-content:flex-start;
    padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 0 8px}
  body.land .side{min-width:0}
  body.land .side.r{margin-left:auto}
  body.land #prompt{height:56px}
  body.land #close{top:calc(env(safe-area-inset-top) + 70px)}

  @media (max-width:420px){
    #top{padding-left:8px;padding-right:8px;gap:6px}
    .side{min-width:0;gap:6px}
    .round{width:46px;height:46px;font-size:21px}
    .round.txt{font-size:14px}
    #stars{height:46px;padding:0 12px;font-size:19px}
    #prompt{height:58px;padding:0 8px 0 12px;gap:8px}
    #prompt .hint{font-size:32px}
    #prompt .rep{width:42px;height:42px}
  }
  .btns{display:block}
  @media (orientation:landscape) and (max-height:560px){
    #start .box{max-width:640px}
    #start h1{font-size:36px}
    #start h2{font-size:20px;margin-bottom:14px}
    .btns{display:flex;gap:14px}
    .big{margin:6px 0;padding:14px;font-size:22px}
    .note{margin-top:12px;font-size:12px}
  }

  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  #again{animation:none}
  #again.show{display:block;animation:popc .5s}
  @keyframes popc{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  @keyframes breathe{0%,100%{scale:1}50%{scale:1.03}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>

<div id="top">
  <div class="side"><a id="home" class="round" href="index.html" aria-label="Меню">🏠</a><div id="stars">⭐ <b id="starsN">0</b></div></div>
  <button id="prompt" aria-label="Повторить вопрос"><span class="hint"></span><span class="rep">🔊</span></button>
  <div class="side r">
    <button id="btnLang" class="round txt" aria-label="Язык">Қаз</button>
    <button id="btnMusic" class="round" aria-label="Музыка">🎵</button>
  </div>
</div>

<button id="close" class="round" aria-label="Закрыть">✖</button>
<button id="again">🔄 <span id="againTxt">Ещё раз</span></button>
<div id="sub"></div>

<nav id="modes">
  <button class="mode" data-mode="explore">🪐<span></span></button>
  <button class="mode" data-mode="find">🔍<span></span></button>
  <button class="mode" data-mode="build">🧩<span></span></button>
  <button class="mode" data-mode="rocket">🚀<span></span></button>
</nav>

<div id="start">

    <h1>Привет, планеты!</h1>
    <h2>Сәлем, планеталар!</h2>
    <div class="btns">

    </div>

  </div>
</div>

const KK2RU = {'ә':'э','ғ':'г','қ':'к','ң':'н','ө':'о','ұ':'у','ү':'у','һ':'х','і':'и',
               'Ә':'Э','Ғ':'Г','Қ':'К','Ң':'Н','Ө':'О','Ұ':'У','Ү':'У','Һ':'Х','І':'И'};
function findVoice(prefix){
  const list = voices.filter(v => (v.lang || '').toLowerCase().replace('_','-').startsWith(prefix));
  return list.find(v => v.localService) || list[0] || null;
}
let speakId = 0, subTimer = 0;
function speak(text, onEnd){
  const id = ++speakId;
  showSub(text);
  let done = false;
  const fin = () => {
    if (done) return; done = true;
    if (id !== speakId) return;
    clearTimeout(subTimer);
    subTimer = setTimeout(() => { if (id === speakId) elSub.classList.remove('show'); }, 1400);
    if (onEnd) onEnd();
  };
  const safety = setTimeout(fin, 2200 + text.length * 85);
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    if (!voices.length) loadVoices();
    let say = text, v;
    if (lang === 'kk') {
      v = findVoice('kk');
      if (!v) { v = findVoice('ru'); say = text.replace(/[әғқңөұүһіӘҒҚҢӨҰҮҺІ]/g, c => KK2RU[c]); }
    } else v = findVoice('ru');
    const u = new SpeechSynthesisUtterance(say);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = lang === 'kk' ? 'kk-KZ' : 'ru-RU';
    u.rate = 0.9; u.pitch = 1.15; u.volume = 1;
    u.onend = () => { clearTimeout(safety); setTimeout(fin, 150); };
    u.onerror = () => { clearTimeout(safety); setTimeout(fin, 150); };
    speechSynthesis.speak(u);
  } catch (e) {}
}

let ac = null, master = null, musicOn = true, nextNote = 0;
function audio(){
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    } catch (e) { return null; }

  return ac;
}
function tone(freq, dur, {type='sine', vol=.12, when=0, to=null, attack=.01}={}){
  if (!ac) return;
  const t0 = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + .05);
}

function layout(){
  W = innerWidth; H = innerHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);

  if (land) {
    // меню слева, система на всю высоту, лоток «Собери» — колонкой справа
    ax0 = mw; ax1 = W - safe.r; ay0 = safe.t + 6; ay1 = H - safe.b - 6;
    if (building) {
      trayCols = 2; trayRows = 5;
      traySlotW = trayRowH = Math.min(72, (H - safe.b - 10 - topBarBottom) / 5);
      const tw = traySlotW*2 + 12;

      ax1 = trayRect.x;

    // верхние кнопки стоят по углам и почти не мешают орбитам,
    // поэтому сверху отступаем на всю панель только в «Найди» (там вопрос по центру)
    ax0 = 0; ax1 = W;

    ay1 = H - barH;
    if (building) {
      trayCols = W >= 540 ? 9 : 5; trayRows = Math.ceil(9 / trayCols);
      traySlotW = Math.min(76, (W - 20) / trayCols);
      trayRowH = Math.min(70, Math.max(54, traySlotW));
      const th = trayRows*trayRowH + 10;
      trayRect = {x: 8, y: ay1 - th - 4, w: W - 16, h: th};
      ay1 = trayRect.y - 2;

  const hw = (ax1 - ax0)/2, hh = (ay1 - ay0)/2;
  // планеты крупные: соседние могут перекрываться, но они на разных углах орбит
  U = Math.min(Math.min(hw, hh)*1.25, Math.max(hw, hh)) / 10;
  const minR = Math.max(12, Math.min(16, Math.min(W, H)*.032));
  const pad = Math.max(minR, U*.5) + 6;
  RX = hw - pad; RY = hh - pad;
  if (RY > RX*1.8) RY = RX*1.8;
  if (RX > RY*2.3) RX = RY*2.3;
  const base = Math.min(RX, RY);
  sunR = Math.max(U*1.3, base*.15);
  const a = Math.min(.45, (sunR*1.3 + U*.8) / base);
  orbF = PLANETS.map((_, i) => a + (1-a)*i/8);

function starPath(c, x, y, r, rot){
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i*Math.PI/5 - Math.PI/2, rr = i % 2 ? r*.45 : r;
    c.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr);

}
function blob(c, pts){
  c.beginPath();
  const n = pts.length;
  const mid = (a, b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];
  let m = mid(pts[n-1], pts[0]); c.moveTo(m[0], m[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = mid(p, pts[(i+1)%n]); c.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
  c.closePath();
}
const CONTINENTS = [
  [[-.6,-.5],[-.2,-.68],[.08,-.42],[-.08,-.1],[-.45,.0],[-.72,-.25]],

      c.strokeStyle = ink; c.lineWidth = Math.max(1.2, r*.07); c.lineCap = 'round';
      c.beginPath();
      if (happy) c.arc(x, ey + er*.4, er*.75, Math.PI*1.15, Math.PI*1.85);
      else { c.moveTo(x - er*.8, ey); c.lineTo(x + er*.8, ey); }
      c.stroke();
    } else {
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x, ey, er, 0, 7); c.fill();
      c.fillStyle = ink; c.beginPath(); c.arc(x + lx*er*.35, ey + ly*er*.35, er*.58, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x + lx*er*.35 - er*.2, ey + ly*er*.35 - er*.22, er*.2, 0, 7); c.fill();
    }
    c.fillStyle = 'rgba(255,110,150,.4)'; c.beginPath(); c.arc(s*r*.56, r*.18, r*.13, 0, 7); c.fill();
  }
  if (happy) {
    c.fillStyle = '#7a2d3d'; c.beginPath(); c.arc(0, r*.2, r*.2, 0, Math.PI); c.closePath(); c.fill();
    c.fillStyle = '#ff8fa3'; c.beginPath(); c.arc(0, r*.33, r*.09, Math.PI, 0); c.fill();
  } else {
    c.strokeStyle = ink; c.lineWidth = Math.max(1.2, r*.07); c.lineCap = 'round';
    c.beginPath(); c.arc(0, r*.1, r*.19, Math.PI*.2, Math.PI*.8); c.stroke();
  }
}
function drawBody(c, id, x, y, r, opt = {}){
  const b = bodies[id];
  c.save(); c.translate(x, y);
  if (b.wobbleUntil > now) c.rotate(Math.sin(now*28) * .18 * (b.wobbleUntil - now));
  if (opt.sx) c.scale(opt.sx, opt.sy);
  // направление взгляда — на палец ребёнка
  let lx = look.x - x, ly = look.y - y; const d = Math.hypot(lx, ly) || 1; lx /= d; ly /= d;
  if (d < 2) { lx = 0; ly = 0; }
  if (id === 'sun') { drawSun(c, r); drawFace(c, r*.9, b, lx, ly); c.restore(); return; }
  if (id === 'uranus') {
    const rot = -Math.PI/2 + .15; c.rotate(rot);
    const cs = Math.cos(-rot), sn = Math.sin(-rot); [lx, ly] = [lx*cs - ly*sn, lx*sn + ly*cs];
  }
  const ring = RINGS[id];
  if (ring) { c.save(); c.rotate(ring.tilt); ringHalf(c, r, ring, Math.PI, Math.PI*2); c.restore(); }
  c.save(); c.beginPath(); c.arc(0, 0, r, 0, 7); c.clip();
  const st = STYLE[id];
  const g = c.createRadialGradient(-r*.35, -r*.4, r*.05, 0, 0, r*1.05);
  g.addColorStop(0, st.light); g.addColorStop(1, st.dark);
  c.fillStyle = g; c.fillRect(-r, -r, 2*r, 2*r);
  surface(c, id, r);
  const sh = c.createRadialGradient(-r*.35, -r*.4, r*.1, 0, 0, r*1.02);
  sh.addColorStop(0,'rgba(255,255,255,.3)'); sh.addColorStop(.45,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(10,10,50,.35)');
  c.fillStyle = sh; c.fillRect(-r, -r, 2*r, 2*r);
  c.restore();
  c.lineWidth = Math.max(1, r*.05); c.strokeStyle = 'rgba(20,20,60,.35)';
  c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();
  if (opt.face !== false) drawFace(c, r, b, lx, ly);
  if (ring) { c.save(); c.rotate(ring.tilt); ringHalf(c, r, ring, 0, Math.PI); c.restore(); }
  c.restore();
}
function drawRocket(c, x, y, s, ang, flame){
  c.save(); c.translate(x, y); c.rotate(ang + Math.PI/2);
  if (rocket.wobbleUntil > now) c.rotate(Math.sin(now*30)*.25);
  if (flame) {
    const L = s*(.7 + .25*Math.sin(now*40));
    const fg = c.createLinearGradient(0, s*.5, 0, s*.5 + L);
    fg.addColorStop(0,'#fff6a0'); fg.addColorStop(.5,'#ffa53a'); fg.addColorStop(1,'rgba(255,80,40,0)');
    c.fillStyle = fg; c.beginPath(); c.moveTo(-s*.22, s*.5); c.quadraticCurveTo(0, s*.5 + L*1.3, s*.22, s*.5); c.fill();
  }
  // крылья
  c.fillStyle = '#ff5a5f';
  c.beginPath(); c.moveTo(-s*.3, s*.05); c.lineTo(-s*.62, s*.6); c.lineTo(-s*.28, s*.5); c.fill();
  c.beginPath(); c.moveTo(s*.3, s*.05); c.lineTo(s*.62, s*.6); c.lineTo(s*.28, s*.5); c.fill();
  // корпус
  c.fillStyle = '#f5f7ff';
  c.beginPath(); c.moveTo(0, -s);
  c.bezierCurveTo(s*.5, -s*.55, s*.42, s*.3, s*.3, s*.55);
  c.lineTo(-s*.3, s*.55);
  c.bezierCurveTo(-s*.42, s*.3, -s*.5, -s*.55, 0, -s);
  c.fill();
  c.strokeStyle = 'rgba(40,40,90,.35)'; c.lineWidth = Math.max(1, s*.05); c.stroke();
  c.fillStyle = '#ff5a5f';
  c.beginPath(); c.moveTo(0, -s); c.bezierCurveTo(s*.28, -s*.8, s*.36, -s*.62, s*.38, -s*.52);
  c.lineTo(-s*.38, -s*.52); c.bezierCurveTo(-s*.36, -s*.62, -s*.28, -s*.8, 0, -s); c.fill();
  // окошко с космонавтом
  c.fillStyle = '#5fb8ff'; c.beginPath(); c.arc(0, -s*.12, s*.2, 0, 7); c.fill();
  c.strokeStyle = '#9aa3c7'; c.lineWidth = s*.06; c.stroke();
  c.fillStyle = '#ffd9b3'; c.beginPath(); c.arc(0, -s*.1, s*.11, 0, 7); c.fill();
  c.fillStyle = '#2b1b3d';
  c.beginPath(); c.arc(-s*.04, -s*.12, s*.02, 0, 7); c.arc(s*.04, -s*.12, s*.02, 0, 7); c.fill();
  c.restore();
}
function drawComet(){
  if (!comet) return;
  let dx = comet.x - cx, dy = comet.y - cy; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
  const L = U*5, w = U*.55;
  const g = ctx.createLinearGradient(comet.x, comet.y, comet.x + dx*L, comet.y + dy*L);
  g.addColorStop(0,'rgba(200,235,255,.85)'); g.addColorStop(1,'rgba(120,180,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(comet.x - dy*w, comet.y + dx*w);
  ctx.lineTo(comet.x + dx*L, comet.y + dy*L);
  ctx.lineTo(comet.x + dy*w, comet.y - dx*w);
  ctx.closePath(); ctx.fill();
  const rg = ctx.createRadialGradient(comet.x, comet.y, 0, comet.x, comet.y, U*.9);
  rg.addColorStop(0,'#ffffff'); rg.addColorStop(.35,'rgba(200,240,255,.9)'); rg.addColorStop(1,'rgba(150,200,255,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(comet.x, comet.y, U*.9, 0, 7); ctx.fill();
}

const COLORS = ['#ffd23f','#ff8fa3','#7fe3ff','#b8ff7a','#ffffff','#c9a0ff'];
function burst(x, y, n = 18, power = 1){
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, sp = (60 + Math.random()*160) * power;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, decay:.7 + Math.random()*.5,
      r:3 + Math.random()*5*power, rot:Math.random()*6, vr:(Math.random()-.5)*8, col:pick(COLORS), star:true});
  }
}
function trail(x, y){
  parts.push({x:x + (Math.random()-.5)*4, y:y + (Math.random()-.5)*4, vx:(Math.random()-.5)*20, vy:(Math.random()-.5)*20,
    life:1, decay:1.6, r:2 + Math.random()*3, col:pick(['#ffd23f','#ffa53a','#fff6a0']), star:false});
}
function celebrate(){
  sfx.big();
  for (let i = 0; i < 6; i++) setTimeout(() => burst(W*(.15 + Math.random()*.7), H*(.2 + Math.random()*.5), 26, 1.3), i*220);
}

/* =========================================================
   ОБНОВЛЕНИЕ
   ========================================================= */
function speedFactor(){
  if (mode === 'explore') return card ? .15 : 1;
  if (mode === 'find') return .35;
  if (mode === 'rocket') return .45;
  return .7;
}
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
const easeBack = t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
function orbitPos(i, ang){ return {x: cx + Math.cos(ang)*orbF[i]*RX, y: cy + Math.sin(ang)*orbF[i]*RY}; }

function update(dt){
  const sf = speedFactor();
  PLANETS.forEach((id, i) => {
    const b = bodies[id];
    if (!b.placed) return;
    b.ang += OMEGA[i] * dt * sf;
    const p = orbitPos(i, b.ang);
    if (b.snap) {
      b.snap.t += dt / .45;
      const e = ease(Math.min(1, b.snap.t));
      b.x = b.snap.x + (p.x - b.snap.x)*e; b.y = b.snap.y + (p.y - b.snap.y)*e;
      if (b.snap.t >= 1) b.snap = null;
    } else { b.x = p.x; b.y = p.y; }
  });
  moonAng += 1.5 * dt * sf;
  const e = bodies.earth, m = bodies.moon;
  const mr = e.r + m.r + U*.5;
  m.x = e.x + Math.cos(moonAng)*mr; m.y = e.y + Math.sin(moonAng)*mr*.85;

  // моргание
  for (const id in bodies) {
    const b = bodies[id];
    if (now > b.nextBlink) { b.blinkUntil = now + .14; b.nextBlink = now + 2 + Math.random()*4; }
  }
  // взгляд: если ребёнок давно не трогал экран — планеты смотрят по сторонам
  if (now > lookUntil) { look.x = Math.random()*W; look.y = Math.random()*H; lookUntil = now + 2 + Math.random()*3; }

  // ракета
  if (mode === 'rocket') updateRocket(dt);

  // комета
  if (!comet && (mode === 'explore' || mode === 'rocket') && !card && now > nextComet) spawnComet();
  if (comet) {
    comet.x += comet.vx*dt; comet.y += comet.vy*dt;
    if (comet.x < -200 || comet.x > W + 200 || comet.y < -200 || comet.y > H + 200) { comet = null; nextComet = now + 18 + Math.random()*20; }
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .97; p.vy *= .97; p.rot = (p.rot || 0) + (p.vr || 0)*dt;
    p.life -= p.decay*dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (card) card.t += dt;
  musicTick();
}
function spawnComet(){
  const side = Math.floor(Math.random()*4);
  let x, y, tx, ty;
  if (side === 0) { x = -60; y = Math.random()*H*.6 + H*.1; tx = W + 60; ty = Math.random()*H; }
  else if (side === 1) { x = W + 60; y = Math.random()*H*.6 + H*.1; tx = -60; ty = Math.random()*H; }
  else if (side === 2) { x = Math.random()*W; y = -60; tx = Math.random()*W; ty = H + 60; }
  else { x = Math.random()*W; y = H + 60; tx = Math.random()*W; ty = -60; }
  const d = Math.hypot(tx - x, ty - y), sp = 55 + Math.random()*35;
  comet = {x, y, vx:(tx - x)/d*sp, vy:(ty - y)/d*sp, tapped:false};
}
function rocketAnchor(id){
  const b = bodies[id], rr = b.r + U*1.1;
  return {x: b.x + Math.cos(rocket.orbitA)*rr, y: b.y + Math.sin(rocket.orbitA)*rr*.85};
}
function updateRocket(dt){
  const px = rocket.x, py = rocket.y;
  if (rocket.state === 'parked') {
    rocket.orbitA += .9*dt;
    const p = rocketAnchor(rocket.at);
    rocket.x = p.x; rocket.y = p.y;
    rocket.ang = Math.atan2(Math.cos(rocket.orbitA)*.85, -Math.sin(rocket.orbitA));
  } else if (rocket.state === 'flying') {
    rocket.t += dt / rocket.dur;
    const t = ease(Math.min(1, rocket.t));
    const tg = rocketAnchor(rocket.target), f = rocket.from, c = rocket.ctrl;
    const u = 1 - t;
    rocket.x = u*u*f.x + 2*u*t*c.x + t*t*tg.x;
    rocket.y = u*u*f.y + 2*u*t*c.y + t*t*tg.y;
    const mdx = rocket.x - px, mdy = rocket.y - py;
    if (Math.hypot(mdx, mdy) > .3) rocket.ang = Math.atan2(mdy, mdx);
    trail(rocket.x - Math.cos(rocket.ang)*U*.9, rocket.y - Math.sin(rocket.ang)*U*.9);
    if (rocket.t >= 1) arrive();
  }
}

/* =========================================================
   ОТРИСОВКА КАДРА
   ========================================================= */
function render(){
  ctx.drawImage(bg, 0, 0, W, H);
  for (const s of twinkles) {
    const a = .3 + .7*Math.abs(Math.sin(now*1.3 + s.ph));
    ctx.globalAlpha = a; ctx.fillStyle = '#fff';
    starPath(ctx, s.x, s.y, s.r*1.6, 0); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // орбиты
  const dragI = build.drag ? PLANETS.indexOf(build.drag.id) : -1;
  PLANETS.forEach((id, i) => {
    ctx.beginPath(); ctx.ellipse(cx, cy, orbF[i]*RX, orbF[i]*RY, 0, 0, Math.PI*2);
    if (i === dragI) {
      ctx.setLineDash([]); ctx.lineWidth = 7;
      ctx.strokeStyle = `rgba(255,220,90,${.45 + .35*Math.sin(now*7)})`;
    } else {
      ctx.setLineDash([4, 7]); ctx.lineWidth = mode === 'build' ? 2 : 1.5;
      ctx.strokeStyle = mode === 'build' && !bodies[id].placed ? 'rgba(190,210,255,.35)' : 'rgba(180,200,255,.16)';
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);

  drawComet();
  drawBody(ctx, 'sun', cx, cy, sunR);
  for (const id of PLANETS) {
    const b = bodies[id];
    if (b.placed) drawBody(ctx, id, b.x, b.y, b.r);
  }
  if (bodies.earth.placed) drawBody(ctx, 'moon', bodies.moon.x, bodies.moon.y, bodies.moon.r);

  if (mode === 'rocket') drawRocket(ctx, rocket.x, rocket.y, U*1.05, rocket.ang, rocket.state === 'flying');
  if (mode === 'build') drawTray();

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col;
    if (p.star) { starPath(ctx, p.x, p.y, p.r, p.rot); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r*p.life, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  if (build.drag) {
    const d = build.drag, r = bodies[d.id].r;
    drawBody(ctx, d.id, d.x, d.y, r);
  }
  if (card) drawCard();
}
function drawTray(){
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  const tr = trayRect;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(tr.x, tr.y, tr.w, tr.h, 22) : ctx.rect(tr.x, tr.y, tr.w, tr.h); ctx.fill();
  for (const id of build.order) {
    const b = bodies[id];
    if (b.placed || (build.drag && build.drag.id === id)) continue;
    const tp = build.trayPos[id]; if (!tp) continue;
    let x = tp.x, y = tp.y + Math.sin(now*2 + PLANETS.indexOf(id))*3, r = trayR(id);
    if (b.back) {
      b.back.t += frameDt / .4;
      const e = ease(Math.min(1, b.back.t));
      x = b.back.x + (x - b.back.x)*e; y = b.back.y + (y - b.back.y)*e;
      r = b.back.r + (r - b.back.r)*e;
      if (b.back.t >= 1) b.back = null;
    }
    drawBody(ctx, id, x, y, r);
  }
}
function drawCard(){
  const t = card.t, a = Math.min(1, t/.3);
  ctx.fillStyle = `rgba(6,8,30,${.78*a})`; ctx.fillRect(0, 0, W, H);
  const k = easeBack(Math.min(1, t/.55));
  const id = card.id;
  // Rb — итоговый радиус, R — с анимацией появления. Сатурн меньше, чтобы кольца влезли в экран.
  let Rb, x, y, fs, nx, ny;
  if (land) {
    const aw = ax1 - ax0, ah = ay1 - ay0;
    Rb = Math.min(ah*.33, aw*.2) * (id === 'saturn' ? .7 : 1);
    x = ax0 + aw*.33; y = cy;
    fs = Math.max(26, Math.min(44, aw*.06));
    nx = ax0 + aw*.74; ny = cy - fs*.4;
  } else {
    const top = topBarBottom, ah = ay1 - top;
    Rb = Math.min(W*.3, ah*.26) * (id === 'saturn' ? .68 : 1);
    x = W/2; y = top + ah*.44;
    fs = Math.max(28, Math.min(46, W*.1));
    nx = x; ny = y + Rb*(id === 'saturn' ? 1.1 : 1) + fs*1.1 + (id === 'sun' ? Rb*.45 : 0);
  }
  const R = Rb * k;
  let sx = 1, sy = 1;
  const bt = now - card.bounce;
  if (bt < .6) { const w = Math.sin(bt*22) * (1 - bt/.6) * .12; sx = 1 + w; sy = 1 - w; }
  if (id === 'earth') {
    const ma = now*.9, mr = R*1.45;
    const mx = x + Math.cos(ma)*mr, my = y + Math.sin(ma)*mr*.55;
    if (Math.sin(ma) < 0) drawBody(ctx, 'moon', mx, my, R*.27);
    drawBody(ctx, id, x, y, R, {sx, sy});
    if (Math.sin(ma) >= 0) drawBody(ctx, 'moon', mx, my, R*.27);
  } else {
    drawBody(ctx, id, x, y, R, {sx, sy});
    if (id === 'jupiter') {
      drawBody(ctx, 'earth', x + R*1.15, y + R*.85, Math.max(5, R*.09));
    }
  }
  // название
  ctx.globalAlpha = a;
  ctx.font = `900 ${fs}px Nunito, system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(20,10,60,.8)'; ctx.strokeText(nm(id), nx, ny);
  ctx.fillStyle = '#ffe07a'; ctx.fillText(nm(id), nx, ny);
  // точки-факты
  const n = FACTS[lang][id].length;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i === card.fact ? '#ffd23f' : 'rgba(255,255,255,.3)';
    ctx.beginPath(); ctx.arc(nx + (i - (n-1)/2)*22, ny + fs*.85, 6, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  card.R = R; card.x = x; card.y = y;
}

/* =========================================================
   ВВОД
   ========================================================= */
function visibleBodies(){
  const list = ['sun'];
  for (const id of PLANETS) if (bodies[id].placed) list.push(id);
  if (bodies.earth.placed) list.push('moon');
  return list;
}
function hitBody(x, y){
  let best = null, bs = 1e9;
  for (const id of visibleBodies()) {
    const b = id === 'sun' ? {x:cx, y:cy, r:sunR*1.25} : bodies[id];
    const d = Math.hypot(x - b.x, y - b.y), pad = Math.max(22, b.r*.35);
    if (d < b.r + pad) { const s = d / (b.r + pad); if (s < bs) { bs = s; best = id; } }
  }
  return best;
}
function hitComet(x, y){ return comet && Math.hypot(x - comet.x, y - comet.y) < Math.max(40, U*2.2); }

cv.addEventListener('pointerdown', e => {
  if (!started) return;
  audio();
  const x = e.clientX, y = e.clientY;
  look.x = x; look.y = y; lookUntil = now + 3;
  if (card) { cardTap(x, y); return; }
  if (mode === 'build') { buildDown(e, x, y); return; }
  if (hitComet(x, y)) { cometTap(); return; }
  const id = hitBody(x, y);
  if (!id) return;
  if (mode === 'explore') openCard(id);
  else if (mode === 'find') findTap(id);
  else if (mode === 'rocket') rocketTap(id);
});
cv.addEventListener('pointermove', e => {
  if (!started) return;
  look.x = e.clientX; look.y = e.clientY; lookUntil = now + 3;
  const d = build.drag;
  if (d && e.pointerId === d.pid) {
    d.x = e.clientX; d.y = e.clientY - d.lift;
    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 12) d.moved = true;
  }
});
const endDrag = e => {
  const d = build.drag;
  if (!d || e.pointerId !== d.pid) return;
  build.drag = null;
  buildDrop(d, e.type === 'pointercancel');
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* ---------- Знакомство ---------- */
function openCard(id){
  sfx.open();
  card = {id, t:0, fact:0, bounce:now};
  bodies[id].happyUntil = now + 1.2;
  elClose.style.display = 'flex';
  speak(FACTS[lang][id][0]);
}
function cardTap(x, y){
  if (card.R && Math.hypot(x - card.x, y - card.y) < card.R*1.25) {
    sfx.tap();
    card.fact = (card.fact + 1) % FACTS[lang][card.id].length;
    card.bounce = now;
    bodies[card.id].happyUntil = now + 1.2;
    burst(x, y, 10, .7);
    speak(FACTS[lang][card.id][card.fact]);
  } else closeCard();
}
function closeCard(){
  card = null; elClose.style.display = 'none';
  speakId++; try { speechSynthesis.cancel(); } catch (e) {}
  elSub.classList.remove('show');
}
function cometTap(){
  if (!comet) return;
  sfx.sparkle(); burst(comet.x, comet.y, 22, 1);
  comet.vx *= 1.6; comet.vy *= 1.6;
  speak(T().comet);
}

/* ---------- Найди ---------- */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startFind(){
  const easy = shuffle(QUESTIONS.slice(0, 5)), rest = shuffle(QUESTIONS.slice(5));
  find = {order: easy.concat(rest), idx: -1, q: null, lock: false};
  elStars.style.display = 'flex'; elStarsN.textContent = stars;
  nextQuestion(T().intro.find + ' ');
}
function nextQuestion(prefix = ''){
  if (mode !== 'find') return;
  find.idx = (find.idx + 1) % find.order.length;
  if (find.idx === 0 && find.q) find.order = shuffle(find.order.slice());
  find.q = find.order[find.idx]; find.lock = false;
  elPrompt.style.display = 'flex';
  elPrompt.style.animation = 'none'; void elPrompt.offsetWidth; elPrompt.style.animation = '';
  elPrompt.querySelector('.hint').textContent = find.q.hint;
  speak(prefix + find.q[lang]);
}
function findTap(id){
  if (!find.q || find.lock) return;
  const b = bodies[id];
  const bx = id === 'sun' ? cx : b.x, by = id === 'sun' ? cy : b.y;
  if (id === find.q.id) {
    find.lock = true;
    sfx.success(); burst(bx, by, 26, 1.1);
    b.happyUntil = now + 3;
    stars++; elStarsN.textContent = stars;
    try { localStorage.setItem('planets_stars', String(stars)); } catch (e) {}
    let text = pick(T().praise) + ' ' + T().isThis(nm(id));
    if (stars % 5 === 0) { text += ' ' + T().five; setTimeout(celebrate, 400); }
    speak(text, () => setTimeout(() => nextQuestion(), 500));
  } else {
    sfx.soft(); b.wobbleUntil = now + .6;
    speak(T().isThis(nm(id)) + ' ' + T().tryAgain);
  }
}
elPrompt.addEventListener('click', () => { audio(); if (find.q && !find.lock) { sfx.tap(); speak(find.q[lang]); } });

/* ---------- Собери ---------- */
function startBuild(){
  build.order = shuffle(PLANETS.slice());
  build.done = false; build.drag = null;
  for (const id of PLANETS) { bodies[id].placed = false; bodies[id].snap = null; bodies[id].back = null; }
  layout();
  speak(T().intro.build);
}
function buildDown(e, x, y){
  if (build.drag) return;
  let best = null, bd = 1e9;
  for (const id of build.order) {
    if (bodies[id].placed) continue;
    const tp = build.trayPos[id]; if (!tp) continue;
    const d = Math.hypot(x - tp.x, y - tp.y);
    if (d < traySlotW*.6 && d < bd) { bd = d; best = id; }
  }
  if (!best) {
    const id = hitBody(x, y);
    if (id) { sfx.tap(); bodies[id].happyUntil = now + 1; speak(T().isThis(nm(id))); }
    return;
  }
  sfx.pick();
  bodies[best].back = null;
  const lift = e.pointerType === 'mouse' ? 0 : Math.max(26, bodies[best].r + 12);
  build.drag = {id: best, pid: e.pointerId, x, y: y - lift, sx: x, sy: y, lift, moved: false};
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
}
function buildDrop(d, cancelled){
  const id = d.id, b = bodies[id], i = PLANETS.indexOf(id);
  const dx = (d.x - cx)/RX, dy = (d.y - cy)/RY, f = Math.hypot(dx, dy);
  const step = orbF[1] - orbF[0];
  if (!cancelled && d.moved && Math.abs(f - orbF[i]) < step*.95) {
    b.placed = true; b.ang = Math.atan2(dy, dx); b.snap = {x: d.x, y: d.y, t: 0};
    b.x = d.x; b.y = d.y;
    b.happyUntil = now + 2.5;
    sfx.success(); burst(d.x, d.y, 20, 1);
    const all = PLANETS.every(p => bodies[p].placed);
    speak(pick(T().praise) + ' ' + T().placed(nm(id)), () => {
      if (all && mode === 'build' && !build.done) {
        build.done = true; celebrate();
        for (const p of PLANETS) bodies[p].happyUntil = now + 4;
        speak(T().built, () => { if (mode === 'build') elAgain.classList.add('show'); });
      }
    });
  } else {
    b.back = {x: d.x, y: d.y, r: bodies[id].r, t: 0};
    if (!d.moved) { sfx.tap(); speak(T().isThis(nm(id))); }
    else { sfx.soft(); speak(T().isThis(nm(id)) + ' ' + T().almost); }
  }
}
elAgain.addEventListener('click', () => { audio(); sfx.tap(); elAgain.classList.remove('show'); startBuild(); });

/* ---------- Ракета ---------- */
function startRocket(){
  rocket.state = 'parked'; rocket.at = 'earth'; rocket.orbitA = 0;
  speak(T().intro.rocket);
}
function rocketTap(id){
  if (rocket.state === 'flying') return;
  if (id === 'sun') {
    sfx.soft(); rocket.wobbleUntil = now + .6; bodies.sun.wobbleUntil = now + .5;
    speak(T().sunHot); return;
  }
  if (id === rocket.at) {
    sfx.tap(); bodies[id].happyUntil = now + 2;
    speak(T().already(nm(id)) + ' ' + FACTS[lang][id][0].replace(/^[^.!]*[.!]\s*/, ''));
    return;
  }
  sfx.whoosh();
  const tg = bodies[id];
  const from = {x: rocket.x, y: rocket.y};
  const mx = (from.x + tg.x)/2, my = (from.y + tg.y)/2;
  let px = -(tg.y - from.y), py = tg.x - from.x; const pl = Math.hypot(px, py) || 1;
  const bend = pl*.3 * (Math.random() < .5 ? -1 : 1);
  rocket.ctrl = {x: mx + px/pl*bend, y: my + py/pl*bend};
  rocket.from = from; rocket.target = id; rocket.t = 0;
  rocket.dur = Math.max(1.6, Math.min(3.4, pl/140));
  rocket.orbitA = Math.atan2(from.y - tg.y, from.x - tg.x);
  rocket.state = 'flying';
  speak(T().launch(nm(id)));
}
function arrive(){
  rocket.state = 'parked'; rocket.at = rocket.target;
  const id = rocket.at, b = bodies[id];
  b.happyUntil = now + 3;
  sfx.success(); burst(rocket.x, rocket.y, 22, 1);
  const fact = FACTS[lang][id][1] || FACTS[lang][id][0];
  speak(T().arrived(nm(id)) + ' ' + fact);
}

/* =========================================================
   РЕЖИМЫ И ЯЗЫК
   ========================================================= */
function setMode(m){
  mode = m;
  document.body.classList.toggle('finding', m === 'find');
  if (card) closeCard();
  build.drag = null;
  elPrompt.style.display = 'none'; elStars.style.display = 'none';
  elAgain.classList.remove('show');
  find.q = null;
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  if (m !== 'build') for (const id of PLANETS) { bodies[id].placed = true; bodies[id].snap = null; bodies[id].back = null; }
  layout();
  if (m === 'explore') { speak(T().intro.explore); nextComet = now + 8; }
  else if (m === 'find') startFind();
  else if (m === 'build') startBuild();
  else if (m === 'rocket') { startRocket(); nextComet = now + 12; }
}
function applyLang(){
  document.documentElement.lang = lang === 'kk' ? 'kk' : 'ru';
  document.title = lang === 'kk' ? 'Сәлем, планеталар!' : 'Привет, планеты!';
  $('#btnLang').textContent = T().langBtn;
  $('#againTxt').textContent = T().again;
  document.querySelectorAll('.mode').forEach(b => { b.querySelector('span').textContent = T().modes[b.dataset.mode]; });
}
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  audio(); sfx.tap();
  if (b.dataset.mode === mode && mode !== 'build') { speak(T().intro[mode] || ''); return; }
  setMode(b.dataset.mode);
}));
$('#btnLang').addEventListener('click', () => {
  audio(); sfx.tap();
  lang = lang === 'ru' ? 'kk' : 'ru';
  try { localStorage.setItem('kids_lang', lang); } catch (e) {}
  applyLang();
  if (card) speak(FACTS[lang][card.id][card.fact]);
  else if (mode === 'find' && find.q) speak(find.q[lang]);
  else speak(T().intro[mode]);
});
$('#btnMusic').addEventListener('click', e => {
  audio(); musicOn = !musicOn;
  e.currentTarget.classList.toggle('off', !musicOn);
  if (musicOn) nextNote = now;
});
elClose.addEventListener('click', () => { sfx.tap(); closeCard(); });

function start(l, m = 'explore'){
  lang = l; started = true;
  try { localStorage.setItem('kids_lang', lang); } catch (e) {}
  audio(); applyLang();
  $('#start').style.display = 'none';
  // iOS: «разбудить» синтез речи внутри жеста пользователя
  try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch (e) {}
  setMode(m);
}
document.querySelectorAll('#start .big').forEach(b => b.addEventListener('click', () => start(b.dataset.lang)));

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { try { speechSynthesis.cancel(); } catch (e) {} if (ac) ac.suspend(); }
  else if (ac && started) ac.resume();
});
addEventListener('resize', () => layout());
addEventListener('orientationchange', () => setTimeout(layout, 250));

/* =========================================================
   ЦИКЛ
   ========================================================= */
let last = performance.now(), frameDt = 0;
function frame(ts){
  const dt = Math.min(.05, (ts - last)/1000); last = ts; now += dt; frameDt = dt;
  update(dt); render();
  requestAnimationFrame(frame);
}
applyLang();
layout();
look.x = W/2; look.y = H/2;
requestAnimationFrame(frame);

// для проверки: ?start=find&lang=kk
const qs = new URLSearchParams(location.search);
if (qs.get('start')) start(qs.get('lang') === 'kk' ? 'kk' : 'ru', qs.get('start'));
</script>
