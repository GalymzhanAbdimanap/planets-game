<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Познавательные игры для детей 3–5 лет на русском и казахском языке.">
<title>Игры</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;min-height:100%}
  body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;
    background:radial-gradient(ellipse at 30% 10%,#3a2a8a 0,transparent 55%),
               radial-gradient(ellipse at 80% 90%,#5a2d7a 0,transparent 50%),#0b1030;
    background-attachment:fixed;min-height:100vh;min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 16px)}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto 16px}
  h1{margin:0;font-size:clamp(26px,7vw,40px);font-weight:900;line-height:1.1;
    background:linear-gradient(#fff3a8,#ffb23f);-webkit-background-clip:text;background-clip:text;color:transparent}
  #lang{flex:none;height:52px;padding:0 18px;border-radius:26px;border:none;background:rgba(255,255,255,.16);color:#fff;
    font-family:inherit;font-size:16px;font-weight:900;cursor:pointer}
  main{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:900px;margin:0 auto}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#fff;
    aspect-ratio:1/1;border-radius:32px;padding:12px;text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,.28),0 16px 30px rgba(0,0,0,.35);transition:transform .12s}
  .tile:active{transform:translateY(5px) scale(.98)}
  .tile .ico{font-size:clamp(56px,19vw,96px);line-height:1;animation:bob 2.6s ease-in-out infinite}
  .tile b{font-size:clamp(17px,4.6vw,24px);font-weight:900;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .tile:nth-child(2) .ico{animation-delay:.4s}.tile:nth-child(3) .ico{animation-delay:.8s}
  .tile:nth-child(4) .ico{animation-delay:1.2s}.tile:nth-child(5) .ico{animation-delay:1.6s}
  .t1{background:linear-gradient(160deg,#4b5bd6,#2a2f8f)}
  .t2{background:linear-gradient(160deg,#8a5be0,#5a2fa8)}
  .t3{background:linear-gradient(160deg,#5fcf6a,#2f9a4a)}
  .t4{background:linear-gradient(160deg,#4fb2f0,#2a6fd0)}
  .t5{background:linear-gradient(160deg,#ffb84a,#f0782e)}
  .t5{grid-column:1 / -1;aspect-ratio:auto;flex-direction:row;gap:16px;padding:18px}
  footer{max-width:900px;margin:22px auto 0;text-align:center;font-size:13px;font-weight:700;color:#9fb0d8;line-height:1.5}
  @media (min-width:700px){
    main{grid-template-columns:repeat(5,1fr)}
    .t5{grid-column:auto;aspect-ratio:1/1;flex-direction:column;gap:6px;padding:12px}
    .tile .ico{font-size:clamp(48px,8vw,84px)}
    .tile b{font-size:clamp(14px,2vw,20px)}
  }
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <button id="lang"></button>
</header>
<main>
  <a class="tile t1" href="planets.html"><span class="ico">🪐</span><b data-ru="Планеты" data-kk="Планеталар"></b></a>
  <a class="tile t2" href="babai.html"><span class="ico">👻</span><b data-ru="Бабай" data-kk="Бабай"></b></a>
  <a class="tile t3" href="veggies.html"><span class="ico">🥕</span><b data-ru="Монстр-огород" data-kk="Құбыжық бақша"></b></a>
  <a class="tile t4" href="police.html"><span class="ico">🚓</span><b data-ru="Полиция" data-kk="Полиция"></b></a>
  <a class="tile t5" href="puppies.html"><span class="ico">🐶</span><b data-ru="Щенки-спасатели" data-kk="Құтқарушы күшіктер"></b></a>
</main>
<footer id="note"></footer>
<script>
'use strict';
let lang = 'ru';
try { const l = localStorage.getItem('kids_lang'); if (l === 'kk' || l === 'ru') lang = l; } catch (e) {}
function apply(){
  document.documentElement.lang = lang === 'kk' ? 'kk' : 'ru';
  document.title = lang === 'kk' ? 'Ойындар' : 'Игры';
  document.getElementById('title').textContent = lang === 'kk' ? 'Не ойнаймыз?' : 'Во что поиграем?';
  document.getElementById('lang').textContent = lang === 'kk' ? 'Русский' : 'Қазақша';
  document.getElementById('note').textContent = lang === 'kk'
    ? '3–5 жастағы балаларға арналған ойындар · Дыбысты қосыңыз 🔊'
    : 'Игры для детей 3–5 лет · Включите звук 🔊';
  document.querySelectorAll('[data-ru]').forEach(el => { el.textContent = el.dataset[lang]; });
}
document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'ru' ? 'kk' : 'ru';
  try { localStorage.setItem('kids_lang', lang); } catch (e) {}
  apply();
});
apply();
</script>
</body>
</html>
